name: Deploy to Cloudflare

# Deploys only on merges to rock and by hand: every deploy drops the live sockets, so there is no
# cron here. The jumbotron snapshot is baked once per deploy and refreshed live in the page.
on:
  push:
    branches: [rock]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Unit checks
        run: npm run test:unit
      - name: Refresh Oogatron activity snapshot
        run: node scripts/jumbotron-data.mjs "$OOGATRON_STATS_URL"
        env:
          OOGATRON_STATS_URL: https://oogatron.ruleswithoutrulers.com/v2/stats
      - name: Build the page into dist/
        run: npm run build:dist
      - name: Install the Worker toolchain
        run: npm ci
        working-directory: worker
      - name: Worker checks
        run: npm test
        working-directory: worker
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply oogaboogaland --remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the Worker
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
